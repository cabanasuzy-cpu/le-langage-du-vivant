<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Le Langage du Vivant — Les deux Adam</title><style>
*{box-sizing:border-box}body{margin:0;background:#132820;color:#f9f0d8;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:10px 8px 70px}.intro{text-align:center;font-size:13px;margin:6px 0 10px}.frame{position:relative;width:100%;box-shadow:0 5px 30px #0008;border-radius:8px;overflow:hidden}.frame img{display:block;width:100%;height:auto}.zone{position:absolute;background:transparent;border:1px solid transparent;cursor:pointer;display:flex;align-items:flex-start;justify-content:flex-end;padding:3px}.zone span{background:#173d36;color:#fff3c8;border:1px solid #e5bd71;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:12px;font-weight:bold;box-shadow:0 2px 5px #0008}.zone:focus-visible{outline:3px solid #f5d389}.zone:hover{background:#e5bd7126;border-color:#e5bd71}.panel{position:fixed;z-index:10;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}.panel.open{display:flex}.sheet{background:#fff6df;color:#302519;border:2px solid #b98c46;border-radius:18px;width:min(100%,650px);max-height:75vh;overflow:auto;padding:22px;box-shadow:0 10px 35px #0008}.sheet h2{margin:0 35px 8px 0;font-family:Georgia,serif;font-size:23px}.sheet .refs{font-size:13px;color:#78552b;font-weight:600}.sheet p{font-size:16px;line-height:1.6}.close{float:right;border:0;background:#173d36;color:white;border-radius:50%;font-size:22px;width:36px;height:36px;cursor:pointer}.hint{text-align:center;font-size:12px;opacity:.8;margin:8px} @media(min-width:700px){.panel{align-items:center}.zone span{width:30px;height:30px;font-size:14px}}
</style></head><body><nav aria-label="Navigation du projet" style="padding:12px;display:flex;gap:16px;flex-wrap:wrap;background:#173b34;color:#fff;font:16px system-ui"><a style="color:#ffe3a3" href="index.html">Index maître</a><a style="color:#ffe3a3" href="1dH4aQPVyzaVhNxw2N6WqOOgcv4hkxvIh.html">Fresque immersive</a></nav><main class="wrap"><div class="intro">Touchez un numéro sur l'image pour ouvrir l'étude correspondante.</div><div class="frame"><img alt="Le Langage du Vivant — Le premier Adam et le dernier Adam, infographie originale" src="assets/33c7f7b1f4d79435b8487ded18431b54304f5527535d060e5081bceca4b3eab4.png"><button class="zone" style="left:10%;top:14%;width:37%;height:25%" data-id="0" aria-label="Ouvrir : Le premier Adam"><span>1</span></button>

</div><div class="hint">L'image originale est conservée intégralement. Huit zones tactiles.</div></main><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="title"><div class="sheet"><button class="close" id="close" aria-label="Fermer">×</button><h2 id="title"></h2><div class="refs" id="refs"></div><p id="body"></p></div></div><script>const entries=[{"title": "Le premier Adam", "ref": "Genèse 2–3 ; Romains 5:12-19", "body": "Adam reçoit le commandement, mange du fruit et désigne sa femme devant Dieu. Paul relie sa désobéissance à l’entrée du péché et de la mort dans le monde."}, {"title": "Le dernier Adam", "ref": "1 Corinthiens 15:45 ; Romains 5:19", "body": "Yeshua accomplit la volonté du Père, obéit jusqu’à la mort et se livre pour son Assemblée. Paul oppose l’obéissance du Messie à la désobéissance d’Adam."}, {"title": "La responsabilité du gardien", "ref": "Genèse 2:15-17", "body": "Les verbes hébreux עָבַד (‘avad : travailler, servir) et שָׁמַר (shamar : garder, préserver) décrivent la mission confiée à Adam dans le jardin."}, {"title": "La femme, la vie et la promesse", "ref": "Genèse 3:15,20", "body": "Dieu annonce la descendance de la femme. Adam donne ensuite à sa femme le nom de Ḥavvah (Ève), associé à la vie, car elle est la mère de tous les vivants."}, {"title": "Le côté d’Adam et le mystère", "ref": "Genèse 2:21-22 ; Éphésiens 5:30-32", "body": "La femme est formée du côté d’Adam. Paul rapproche l’union de l’homme et de la femme du mystère de Christ et de son Assemblée."}, {"title": "Comparaison des deux Adam", "ref": "Romains 5:19 ; 1 Corinthiens 15:22,45", "body": "Premier Adam : désobéissance, mort, âme vivante. Dernier Adam : obéissance, vie et résurrection, esprit vivifiant."}, {"title": "Enseignements clés", "ref": "Genèse 3:12-13 ; 1 Timothée 2:14 ; Éphésiens 5:25", "body": "Adam et Ève désobéissent tous deux, mais le récit distingue leurs circonstances et leurs réponses. Adam tente de déplacer sa responsabilité; Yeshua se livre pour son Assemblée."}, {"title": "Le fil de la restauration", "ref": "Genèse 2–3 ; Luc 1:35 ; Éphésiens 5:25 ; Apocalypse 21", "body": "Création → chute → promesse → accomplissement → rachat → restauration. Cette frise relie les scènes et les textes majeurs de l’étude."}];const panel=document.getElementById('panel');document.querySelectorAll('.zone').forEach(b=>b.addEventListener('click',()=>{const d=entries[Number(b.dataset.id)];document.getElementById('title').textContent=d.title;document.getElementById('refs').textContent=d.ref;document.getElementById('body').textContent=d.body;panel.classList.add('open');document.getElementById('close').focus()}));function close(){panel.classList.remove('open')}document.getElementById('close').onclick=close;panel.addEventListener('click',e=>{if(e.target===panel)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></body></html>
