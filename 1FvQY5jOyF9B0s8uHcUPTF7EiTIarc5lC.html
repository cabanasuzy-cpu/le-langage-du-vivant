ar son comportement moral.','Ésaïe 1.4 ; Proverbes 11.18',65,41,34,11),\\n('verbal','7. Usages verbaux','Expressions associées à la transmission, à l’établissement ou à la préservation d’une descendance.','Genèse 21.13 ; 2 Samuel 7.12',2,53,34,12),\\n('prophetie','8. Dimension prophétique','Lecture chrétienne de Genèse 3.15 et des promesses à Abraham et David. Il faut distinguer le sens lexical de l’interprétation messianique.','Genèse 3.15 ; Galates 3.16 ; 2 Samuel 7.12',65,53,34,12),\\n('femme','La semence de la femme','Genèse 3.15 oppose la descendance de la femme à celle du serpent; le texte est lu comme protoévangile dans la tradition chrétienne.','Genèse 3.15',30,60,12,13),\\n('abraham','La semence d’Abraham','La promesse concerne la postérité d’Abraham; Galates 3.16 en propose une lecture christologique.','Genèse 12.7 ; Galates 3.16',43,60,14,13),\\n('david','La semence de David','Promesse dynastique à David, réinterprétée dans l’espérance messianique.','2 Samuel 7.12-16',58,60,12,13),\\n('resume','En résumé','Le terme possède des emplois agricoles, biologiques, généalogiques et collectifs; son sens précis dépend du passage.','Consulter les passages cités dans la carte',2,74,33,15),\\n('pistes','Pistes d’étude','Comparer les passages bibliques, puis distinguer observation linguistique, typologie et interprétation théologique.','Genèse 3.15 ; 4.25 ; Galates 3.16',66,74,32,15),\\n('messie','Le Zéra‘ promis','La lecture chrétienne relie plusieurs promesses de descendance à Yeshua, le Messie.','Matthieu 1.1 ; Galates 3.16 ; Apocalypse 22.16',35,80,30,10)\\n]\\nbuttons='\\\\n'.join(f'\u003cbutton class=\\\"hot\\\" style=\\\"left:{x}%;top:{y}%;width:{w}%;height:{h}%\\\" aria-label=\\\"Ouvrir {html.escape(title)}\\\" onclick=\\\"openCard(\\\\'{id}\\\\')\\\"\u003e\u003c/button\u003e' for id,title,desc,ref,x,y,w,h in items)\\ndata={id:{'title':title,'desc':desc,'refs':ref} for id,title,desc,ref,*_ in items}\\nimport json\\njs=json.dumps(data,ensure_ascii=False)\\npage teractives\\\"\u003e\\n  \u003cimg alt=\\\"Carte illustrée de זֶרַע, la semence\\\" src=\\\"data:image/png;base64,IMAGE_DATA\\\"\u003e\\n  \u003cbutton class=\\\"hotspot h1\\\" data-id=\\\"seed\\\" aria-label=\\\"Ouvrir le sens premier : semence\\\"\u003e\u003cspan\u003e1 · Semence\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h2\\\" data-id=\\\"harvest\\\" aria-label=\\\"Ouvrir produits et récoltes\\\"\u003e\u003cspan\u003e2 · Récoltes\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h3\\\" data-id=\\\"virile\\\" aria-label=\\\"Ouvrir semence virile\\\"\u003e\u003cspan\u003e3 · Semence virile\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h4\\\" data-id=\\\"desc\\\" aria-label=\\\"Ouvrir descendance\\\"\u003e\u003cspan\u003e4 · Descendance\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h5\\\" data-id=\\\"israel\\\" aria-label=\\\"Ouvrir peuple d’Israël\\\"\u003e\u003cspan\u003e5 · Israël\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h6\\\" data-id=\\\"figurative\\\" aria-label=\\\"Ouvrir sens figuré\\\"\u003e\u003cspan\u003e6 · Sens figuré\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h7\\\" data-id=\\\"bad\\\" aria-label=\\\"Ouvrir le mauvais sens\\\"\u003e\u003cspan\u003e7 · Sens négatif\u003c/span\u003e\u003c/button\u003e\\n  \u003cbutton class=\\\"hotspot h8\\\" data-id=\\\"grammar\\\" aria-label=\\\"Ouvrir usage grammatical\\\"\u003e\u003cspan\u003e8 · Verbes associés\u003c/span\u003e\u003c/button\u003e\\n \u003c/div\u003e\\n \u003cp class=\\\"note\\\"\u003eTouchez une zone numérotée de la carte pour afficher son contenu. Sur téléphone, le panneau explicatif apparaît sous l’illustration.\u003c/p\u003e\\n\u003c/section\u003e\\n\u003caside class=\\\"panel\\\" aria-live=\\\"polite\\\"\u003e\\n \u003cdiv class=\\\"eyebrow\\\" id=\\\"eyebrow\\\"\u003eNotion centrale\u003c/div\u003e\\n \u003ch2 id=\\\"title\\\"\u003eזֶרַע — Zéra‘\u003c/h2\u003e\\n \u003cdiv id=\\\"content\\\"\u003e\u003cp\u003eLe terme désigne la semence, la graine et, par extension, la descendance ou la postérité. Son sens précis dépend du contexte biblique.\u003c/p\u003e\u003cp\u003eChoisis une des huit zones de l’image pour explorer les emplois relevés dans les sources lexicales.\u003c/p\u003e\u003c/div\u003e\\n \u003cdiv class=\\\"refs\\\" id=\\\"refs\\\"\u003e\u003c/div\u003e\\n\u003c/aside\u003e\\n\u003c/div\u003e\\n\\n\u003csection class=\\\"lineages\\\"\u003e\\n \u003ch2\u003eTrois axes de la descendance promise\u003c/h2\u003e\\n \u003cdiv class=\\\"cards\\\"\u003e\\n  \u003carticle class=\\\"lineage\\\"\u003e\u003ch3\u003eLa זֶרַע de la femme\u003c/h3\u003e\u003cp\u003eGenèse 3.15 : la descendance de la femme et l’inimitié annoncée contre le serpent. Lire le texte dans son contexte avant d’en développer l’interprétation messianique.\u003c/p\u003e\u003ca href=\\\"https://www.sefaria.org/Genesis.3.15\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eGenèse 3.15 — texte hébreu ↗\u003c/a\u003e\u003c/article\u003e\\n  \u003carticle class=\\\"lineage\\\"\u003e\u003ch3\u003eLa זֶרַע d’Abraham\u003c/h3\u003e\u003cp\u003eLa promesse faite à Abraham, sa descendance et la bénédiction des familles de la terre. Galates 3 développe la lecture apostolique de cette promesse.\u003c/p\u003e\u003ca href=\\\"https://drive.google.com/file/d/1rZEFDzPGqqpRVhCLtv91uEWLQqjG6RUW/view#c250-descendance-alliances-heritage-nations-20261017\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eÉtude C250 — descendance et héritage ↗\u003c/a\u003e\u003c/article\u003e\\n  \u003carticle class=\\\"lineage\\\"\u003e\u003ch3\u003eLa זֶרַע d’Israël\u003c/h3\u003e\u003cp\u003eEmploi collectif pour désigner Israël, Jacob ou le peuple, y compris les générations futures dans le langage prophétique.\u003c/p\u003e\u003ca href=\\\"https://drive.google.com/file/d/1rZEFDzPGqqpRVhCLtv91uEWLQqjG6RUW/view#c234-deux-semences-lignees-genese-20261017\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"\u003eÉtude C234 — lignées de la Genèse ↗\u003c/a\u003e\u003c/article\u003e\\n \u003c/div\u003e\\n\u003c/section\u003e\\n\u003cdiv class=\\\"nav\\\" aria-label=\\\"Navigation des thèmes\\\"\u003e\\n \u003cbutton data-id=\\\"seed\\\" class=\\\"active\\\"\u003eSemence\u003c/button\u003e\u003cbutton data-id=\\\"harvest\\\"\u003eRécoltes\u003c/button\u003e\u003cbutton data-id=\\\"virile\\\"\u003eSemence virile\u003c/button\u003e\u003cbutton data-id=\\\"desc\\\"\u003eDescendance\u003c/button\u003e\u003cbutton data-id=\\\"israel\\\"\u003eIsraël\u003c/button\u003e\u003cbutton data-id=\\\"figurative\\\"\u003eSens figuré\u003c/button\u003e\u003cbutton data-id=\\\"bad\\\"\u003eSens négatif\u003c/button\u003e\u003cbutton data-id=\\\"grammar\\\"\u003eVerbes associés\u003c/button\u003e\\n\u003c/div\u003e\\n\u003c/main\u003e\\n\u003cfooter\u003eLe Langage du Vivant · Carte de travail · Les correspondances interprétatives doivent être distinguées des sens lexicaux attestés.\u003c/footer\u003e\\n\u003cscript\u003e\\nconst data={\\nseed:{eyebrow:\\\"1 · Sens premier\\\",title:\\\"זֶרַע — Semence et graine\\\",html:\\\"\u003cp\u003e\u003cb\u003eזֶרַע\u003c/b\u003e désigne d’abord la graine ou la semence destinée à être semée. Le terme peut aussi désigner l’ensemencement, notamment le cycle qui revient à sa saison.\u003c/p\u003e\u003cul\u003e\u003cli\u003eUne graine déposée en terre.\u003c/li\u003e\u003cli\u003eUn ensemencement en vue d’une récolte.\u003c/li\u003e\u003cli\u003eUn processus de renouvellement agricole.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cb\u003eRepère :\u003c/b\u003e Genèse 1.11 présente la végétation portant sa semence en elle.\u003c/p\u003e\\\",links:[[\\\"Genèse 1.11\\\",\\\"https://www.sefaria.org/Genesis.1.11\\\"],[\\\"Étude C233 — semence, racine, fruit\\\",\\\"https://drive.google.com/file/d/1rZEFDzPGqqpRVhCLtv91uEWLQqjG6RUW/view#c233-semence-racine-fruit-recolte-20261017\\\"]]},\\nharvest:{eyebrow:\\\"2 · Produit de la semence\\\",title:\\\"Graine, nourriture et récolte\\\",html:\\\"\u003cp\u003eLe mot peut désigner la semence comme produit agricole : grains, céréales, graines d’herbes et d’arbres. Le lexique rapproche aussi l’apparence de la manne de la graine de coriandre.\u003c/p\u003e\u003cul\u003e\u003cli\u003eBlé et autres céréales.\u003c/li\u003e\u003cli\u003eSemences d’herbes et d’arbres.\u003c/li\u003e\u003cli\u003eManne comparée à la graine de coriandre.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIl faut distinguer la graine semée, le produit récolté et la récolte elle-même selon le passage.\u003c/p\u003e\\\",links:[[\\\"Genèse 1.11\\\",\\\"https://www.sefaria.org/Genesis.1.11\\\"],[\\\"Nombres 11.7\\\",\\\"https://www.sefaria.org/Numbers.11.7\\\"],[\\\"Genèse 47.23\\\",\\\"https://www.sefaria.org/Genesis.47.23\\\"]]},\\nvirile:{eyebrow:\\\"3 · Sens biologique\\\",title:\\\"שִׁכְבַת־זֶרַע — Semence virile\\\",html:\\\"\u003cp\u003eDans certains contextes, \u003cb\u003eזֶרַע\u003c/b\u003e désigne la semence masculine ou le sperme. L’expression \u003cb\u003eשִׁכְבַת־זֶרַע\u003c/b\u003e est employée pour l’écoulement de semence.\u003c/p\u003e\u003cp\u003eCe sens biologique doit être lu dans les textes concernés, sans le confondre automatiquement avec les emplois agricoles ou ceux qui désignent une descendance.\u003c/p\u003e\\\",links:[[\\\"Lévitique 15\\\",\\\"https://www.sefaria.org/Leviticus.15\\\"]]},\\ndesc:{eyebrow:\\\"4 · Postérité\\\",title:\\\"זֶרַע — Descendance et lignée\\\",html:\\\"\u003cp\u003eAppliqué aux humains, \u003cb\u003eזֶרַע\u003c/b\u003e désigne collectivement les descendants, la postérité et la lignée. Selon le contexte, il peut viser un fils porteur d’une postérité, des enfants et petits-enfants, une famille ou une maison royale.\u003c/p\u003e\u003cul\u003e\u003cli\u003eDescendance des patriarches, particulièrement Abraham.\u003c/li\u003e\u003cli\u003ePostérité de David et lignée royale.\u003c/li\u003e\u003cli\u003eDescendance de Noé, Aaron et Phinéas.\u003c/li\u003e\u003cli\u003eFamille, généalogie ou nation issue d’une même lignée.\u003c/li\u003e\u003c/ul\u003e\\\",links:[[\\\"Genèse 3.15\\\",\\\"https://www.sefaria.org/Genesis.3.15\\\"],[\\\"Étude C250 — descendance promise\\\",\\\"https://drive.google.com/file/d/1rZEFDzPGqqpRVhCLtv91uEWLQqjG6RUW/view#c250-descendance-alliances-heritage-nations-20261017\\\"],[\\\"Étude C432 — sceptre de Juda et Roi messianique\\\",\\\"https://drive.google.com/file/d/1p1b9XljOVKgyPZFqLSFbkJug4p6vxfbm/view#c432-original-20261022\\\"]]},\\nisrael:{eyebrow:\\\"5 · Emploi collectif\\\",title:\\\"La זֶרַע d’Israël\\\",html:\\\"\u003cp\u003eLe terme peut désigner collectivement le peuple d’Israël, ou la descendance d’Israël/Jacob. Les prophètes l’emploient aussi pour parler des générations futures auxquelles ils s’adressent.\u003c/p\u003e\u003cp\u003eCet emploi souligne une continuité de peuple et de génération. Il ne faut pas réduire chaque occurrence à un individu isolé : le contexte détermine si le mot vise une personne, une lignée ou une collectivité.\u003c/p\u003e\\\",links:[[\\\"Psaume 22.24\\\",\\\"https://www.sefaria.org/Psalms.22.24\\\"],[\\\"Ésaïe 41.8\\\",\\\"https://www.sefaria.org/Isaiah.41.8\\\"],[\\\"Étude C234 — lignées de la Genèse\\\",\\\"https://drive.google.com/file/d/1rZEFDzPGqqpRVhCLtv91uEWLQqjG6RUW/view#c234-deux-semences-lignees-genese-20261017\\\"]]},\\nfigurative:{eyebrow:\\\"6 · Emploi figuré\\\",title:\\\"Semer la justice et la lumière\\\",html:\\\"\u003cp\u003eLe verbe \u003cb\u003eזָרַע\u003c/b\u003e peut être employé figurativement : semer la justice, ou présenter la lumière comme semée pour le juste. Le langage de la semence sert alors à exprimer une action dont le résultat se manifestera en son temps.\u003c/p\u003e\u003cul\u003e\u003cli\u003eSemer la justice : Proverbes 11.18.\u003c/li\u003e\u003cli\u003eLa lumière semée pour le juste : Psaume 97.11.\u003c/li\u003e\u003cli\u003eLa restauration d’une terre labourée et ensemencée : Ézéchiel 36.9.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eLa portée spirituelle est une lecture du contexte figuré, non une définition unique de toutes les occurrences de זֶרַע.\u003c/p\u003e\\\",links:[[\\\"Proverbes 11.18\\\",\\\"https://www.sefaria.org/Proverbs.11.18\\\"],[\\\"Psaume 97.11\\\",\\\"https://www.sefaria.org/Psalms.97.11\\\"],[\\\"Ézéchiel 36.9\\\",\\\"https://www.sefaria.org/Ezekiel.36.9\\\"]]},\\nbad:{eyebrow:\\\"7 · Qualité morale\\\",title:\\\"זֶרַע מְרֵעִים — Descendance de malfaiteurs\\\",html:\\\"\u003cp\u003eLe lexique signale aussi un emploi moral : \u003cb\u003eזֶרַע\u003c/b\u003e peut désigner des personnes ou une communauté caractérisées par une qualité donnée. Dans un sens négatif, \u003cb\u003eזֶרַע מְרֵעִים\u003c/b\u003e signifie une communauté de malfaiteurs.\u003c/p\u003e\u003cp\u003eLe mot « semence » ne porte donc pas, à lui seul, une valeur morale positive. C’est le contexte qui indique la qualité attribuée à la descendance ou au groupe.\u003c/p\u003e\\\",links:[[\\\"Ésaïe 1.4\\\",\\\"https://www.sefaria.org/Isaiah.1.4\\\"]]},\\ngrammar:{eyebrow:\\\"8 · Verbes associés\\\",title:\\\"Les verbes qui accompagnent זֶרַע\\\",html:\\\"\u003cp\u003eLe texte lexical cite plusieurs verbes associés à la semence et à sa transmission :\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eנָתַן\u003c/b\u003e : donner.\u003c/li\u003e\u003cli\u003e\u003cb\u003eשִׂים\u003c/b\u003e : mettre, placer.\u003c/li\u003e\u003cli\u003e\u003cb\u003eהֵקִים\u003c/b\u003e : établir, susciter.\u003c/li\u003e\u003cli\u003e\u003cb\u003eחִיָּה זֶרַע\u003c/b\u003e : maintenir en vie ou donner la vie à la semence.\u003c/li\u003e\u003cli\u003e\u003cb\u003eזָרַע\u003c/b\u003e : semer, répandre, planter.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eLe sens exact de chaque construction dépend de sa syntaxe et du passage où elle apparaît.\u003c/p\u003e\\\",links:[[\\\"Genèse 47.23\\\",\\\"https://www.sefaria.org/Genesis.47.23\\\"],[\\\"Ézéchiel 36.9\\\",\\\"https://www.sefaria.org/Ezekiel.36.9\\\"]]}\\n};\\nfunction select(id){\\n const d=data[id]; if(!d)return;\\n document.getElementById(\\\"eyebrow\\\").textContent=d.eyebrow;\\n document.getElementById(\\\"title\\\").textContent=d.title;\\n document.getElementById(\\\"content\\\").innerHTML=d.html;\\n const refs=document.getElementById(\\\"refs\\\"); refs.innerHTML=\\\"\\\";\\n d.links.forEach(([label,url])=\u003e{const a=document.createElement(\\\"a\\\");a.href=url;a.target=\\\"_blank\\\";a.rel=\\\"noopener\\\";a.textContent=label+\\\" ↗\\\";refs.appendChild(a)});\\n document.querySelectorAll(\\\"[data-id]\\\").forEach(el=\u003eel.classList.toggle(\\\"active\\\",el.dataset.id===id));\\n}\\ndocument.querySelectorAll(\\\"[data-id]\\\").forEach(el=\u003eel.addEventListener(\\\"click\\\",()=\u003eselect(el.dataset.id)));\\nselect(\\\"seed\\\");\\n\u003c/script\u003e\\n\u003c/body\u003e\\n\u003c/html\u003e'''.replace(\\\"IMAGE_DATA\\\", img_b64)\\n\\nout = Path(\\\"/mnt/data/carte_interactive_zera_langage_du_vivant.html\\\")\\nout.write_text(html, encoding=\\\"utf-8\\\")\\nprint(f\\\"Créé : {out.name} — {out.stat().st_size:,} octets\\\")\\n\",\"end_time\",\"final_expression_output\",\"in_kernel_exception\",\"system_exception\",\"messages\",[1459],\"jupyter_messages\",[1435,1436,1437,1438],\"timeout_triggered\",{\"_1439\":287,\"_1440\":1456,\"_285\":1457},{\"_1439\":1454,\"_1440\":1455},{\"_1439\":1449,\"_1440\":1450,\"_285\":1451},{\"_1439\":287,\"_1440\":1441,\"_285\":1442},\"msg_type\",\"parent_header\",{\"_1445\":1446,\"_1447\":1448},{\"_1443\":1444},\"execution_state\",\"idle\",\"msg_id\",\"ab4bcab6-e933caa78ea9df39a3643b22_224_9\",\"version\",\"5.3\",\"stream\",{\"_1445\":1446,\"_1447\":1448},{\"_636\":1452,\"_412\":1453},\"stdout\",\"Créé : carte_interactive_zera_langage_du_vivant.html — 3,695,782 octets\\n\",\"execute_input\",{\"_1445\":1446,\"_1447\":1448},{\"_1445\":1446,\"_1447\":1448},{\"_1443\":1458},\"busy\",{\"_321\":1449,\"_1460\":1461,\"_1462\":1452,\"_1463\":1464,\"_412\":1453},\"tim url\",\"file-service://file-VxLphoaeamsthLrTSaHNYU?shared_conversation_id=6ae64832-0880-83e9-ac94-a8f08b6878d2\",2379,1565,\"\\n\u003c\u003cImageDisplayed\u003e\u003e\",{},{\"_274\":2333,\"_281\":2384,\"_55\":2385,\"_285\":2386,\"_287\":288,\"_289\":14,\"_290\":291,\"_292\":2387,\"_294\":1466},\"3366c247-d16c-4d15-bbc3-69a8ee431b30\",[2317],{\"_416\":417,\"_292\":2393},1754408282.301524,{\"_411\":340,\"_391\":655,\"_412\":2350},{\"_298\":2388,\"_300\":34,\"_301\":2389,\"_303\":2390,\"_319\":2325,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2382,\"_2327\":2328,\"_329\":10,\"_327\":14},{\"_51\":407,\"_408\":2391},[],[],[2392],200007,{},{\"_274\":2382,\"_281\":2397,\"_55\":2398,\"_285\":2399,\"_287\":288,\"_290\":291,\"_292\":2400,\"_294\":295},\"a2e0f69e-625b-4fd0-8429-324835c3aa5d\",[2333],{\"_416\":472,\"_292\":2403},1754408281.569305,{\"_411\":412,\"_413\":2401},{\"_464\":14,\"_319\":2325,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2402],\"Oui\",{},{\"_274\":2395,\"_281\":2407,\"_55\":2408,\"_285\":2409,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2410,\"_294\":295},\"cd8fb5fb-7dbd-4d0c-bd41-d5dfef57b868\",[2382],{\"_416\":417,\"_292\":2418},1754408230.665555,{\"_411\":412,\"_413\":2416},{\"_298\":2411,\"_300\":34,\"_301\":2412,\"_303\":2413,\"_319\":2414,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2405,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2415},[],[],\"96a75fd0cf0fa311-YUL\",[410],[2417],\"Voici une **fiche comparative synthétique** entre les trois grandes **Zéra‘** que tu explores dans ton livre — une fiche-pivot pour aider à **connecter la promesse, la lignée, et l’accomplissement**.\\n\\n---\\n\\n# ✦ **Les Trois Zéra‘ : Femme • Abraham • Israël**  \\n### Une semence, trois dimensions prophétiques unifiées en Messie\\n\\n---\\n\\n## ✦ 1. **Zéra‘ de la femme** (Genèse 3.15)  \\n\u003e *« Je mettrai inimitié entre toi et la femme, entre ta Zéra‘ et sa Zéra‘… »*\\n\\n| Aspect | Détail |\\n|--|--|\\n| **Origine** | Directement annoncée par Dieu après la chute. |\\n| **Nature** | **Surnaturelle** – une femme porte la semence, sans homme. |\\n| **Combat** | Opposée à la Zéra‘ du serpent. Conflit eschatologique entre deux lignées. |\\n| **Accomplissement** | Yeshoua haMashiaḥ, conçu de l’Esprit, né d’une vierge. |\\n| **But** | Écraser le serpent, détruire le mal à la racine. |\\n\\n---\\n\\n## ✦ 2. **Zéra‘ d’Abraham** (Genèse 12.2-3 ; 15.5 ; 22.18)\\n\\n\u003e *« En ta Zéra‘ seront bénies toutes les nations de la terre. »*\\n\\n| Aspect | Détail |\\n|--|--|\\n| **Origine** | Alliance faite avec Abraham. |\\n| **Nature** | Double :  \\n- **Physique** : Isaac, Jacob → Israël ;  \\n- **Spirituelle** : ceux qui ont la foi (Gal. 3.7). |\\n| **Transmission** | Par la foi, pas la chair (Rom. 9.6-8). |\\n| **Accomplissement** | Le Messie, **Zéra‘ unique** d’Abraham (Gal. 3.16). |\\n| **But** | Être bénédiction pour toutes les familles de la terre. |\\n\\n---\\n\\n## ✦ 3. **Zéra‘ d’Israël** (Exode 1.7 ; Deut. 10.15 ; Ps. 22.24)\\n\\n\u003e *« Toute la Zéra‘ d’Israël le craindra. »* (Ps. 22.24)\\n\\n| Aspect | Détail |\\n|--|--|\\n| **Origine** | Descendance des patriarches selon la promesse. |\\n| **Nature** | Peuple élu, **porteur de l’alliance mosaïque**. |\\n| **Identité spirituelle** | Tous ne sont pas la vraie Zéra‘ (Rom. 9.6) ; la vraie Zéra‘ est fidèle. |\\n| **Finalité** | Préparer la venue du Messie, porter la Parole. |\\n| **Accomplissement** | Le **reste fidèle** au sein d’Israël entre dans la Nouvelle Alliance (Rom. 11.5). |\\n\\n---\\n\\n## ✦ Synthèse prophétique\\n\\n| Clé | Zéra‘ de la femme | Zéra‘ d’Abraham | Zéra‘ d’Israël |\\n|--|--|--|--|\\n| **Messie identifié** | Fils de la femme (Luc 1.35) | Fils d’Abraham (Matt. 1.1) | Fils d’Israël (Jean 1.49) |\\n| **But spirituel** | Vaincre le serpent | Bénir les nations | Préparer le Royaume |\\n| **Héritage** | Victoire sur le mal | Foi et justification | Parole et alliance |\\n| **Ensemble accompli en** | Yeshoua haMashiaḥ – la Zéra‘ parfaite, engendrée d’en haut. |\\n\\n---\\n\\n## ✦ Conclusion\\n\\nToutes les **Zéra‘ bibliques convergent** dans **le Messie** :\\n- Il est **la Zéra‘ unique** de la femme,\\n- **la Zéra‘ d’Abraham** bénie pour les nations,\\n- **le Saint d’Israël**, lumière pour les Juifs et les païens.\\n\\n\u003e Par lui, **nous sommes greffés dans la Zéra‘ vivante**, participants de l’alliance, et **appelés à porter du fruit** pour le Royaume éternel.\\n\\n---\\n\\nSouhaites-tu que je crée un **schéma visuel** pour représenter ces trois Zéra‘ dans une page de ton livre ou ta présentation ?\",{},{\"_274\":2405,\"_281\":2422,\"_55\":2423,\"_285\":2424,\"_287\":288,\"_290\":291,\"_292\":2425,\"_294\":295},\"d2730aa7-7e87-4e24-a6e1-c83e76357dc7\",[2395],{\"_416\":472,\"_292\":2427},1754408230.208102,{\"_411\":412,\"_413\":2426},{\"_464\":14,\"_319\":2414,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2402],{},{\"_274\":2420,\"_281\":2431,\"_55\":2432,\"_285\":2433,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2434,\"_294\":295},\"f321d861-1566-45b6-af56-6a968dae9122\",[2405],{\"_416\":417,\"_292\":2442},1754408055.982808,{\"_411\":412,\"_413\":2440},{\"_298\":2435,\"_300\":34,\"_301\":2436,\"_303\":2437,\"_319\":2438,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2429,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2439},[],[],\"96a75b89cd99a24b-YUL\",[410],[2441],\"Voici la **fiche sœur** finale de la série sur la **Zéra‘**, à intégrer dans ton livre :\\n\\n---\\n\\n# ✦ **Zéra‘ d’Abraham (זֶרַע אַבְרָהָם)**  \\n### La promesse d’une postérité selon l’Esprit\\n\\n---\\n\\n## ➤ **Fondement biblique**\\n\\n\u003e **Genèse 15.5-6**  \\n\u003e *« Regarde vers le ciel, et compte les étoiles… ainsi sera ta זֶרַע. Et Abraham crut en l’Éternel, qui le lui imputa à justice. »*\\n\\nLe mot **זֶרַע** dans le contexte d’Abraham désigne une **descendance** :\\n- innombrable comme les étoiles,\\n- bénie,\\n- élue,\\n- et **porteuse d’une alliance éternelle**.\\n\\n---\\n\\n## ✦ I. **Zéra‘ physique – Israël selon la chair**\\n\\nLa première dimension de la promesse est **nationale** :\\n- Abraham engendre **Isaac**, puis **Jacob**, d’où naît **Israël**.\\n- Israël est appelé **Zéra‘ d’Abraham** tout au long des Écritures (2 Rois 13.23 ; Ésaïe 41.8).\\n\\n\u003e Cette postérité naturelle reçoit la **Torah**, le **Pays promis**, le **Temple**, les **prophètes**.\\n\\n---\\n\\n## ✦ II. **Zéra‘ spirituelle – Israël selon la promesse**\\n\\nMais les Écritures vont plus loin :  \\n**La véritable Zéra‘ d’Abraham** est **spirituelle**, non seulement biologique.\\n\\n\u003e **Galates 3.7**  \\n\u003e *« Ce sont ceux qui ont la foi qui sont les fils d’Abraham. »*  \\n\u003e **Galates 3.29**  \\n\u003e *« Si vous êtes au Messie, vous êtes donc la זֶרַע d’Abraham, héritiers selon la promesse. »*\\n\\nCette **Zéra‘ de foi** est :\\n- engendrée par **la Parole de Dieu**,\\n- née **par l’Esprit**, non par la chair (Jean 1.13),\\n- **héritière des promesses** données à Abraham.\\n\\n---\\n\\n## ✦ III. **Le Messie comme Zéra‘ unique**\\n\\n\u003e **Galates 3.16**  \\n\u003e *« Or les promesses ont été faites à Abraham et à sa Zéra‘. Il n’est pas dit : ‘et aux zéra‘ comme s’il s’agissait de plusieurs, mais à une seule : à ta Zéra‘, c’est-à-dire au Messie. »*\\n\\nYeshoua haMashiaḥ est **la Zéra‘ d’Abraham par excellence** :\\n- Il accomplit toutes les promesses,\\n- Il incarne la fidélité d’Abraham,\\n- Il devient **source de bénédiction pour toutes les nations** (Gen. 12.3 ; Gen. 22.18).\\n\\n---\\n\\n## ✦ IV. **La bénédiction pour toutes les nations**\\n\\n\u003e **Genèse 12.3**  \\n\u003e *« En toi seront bénies toutes les familles de la terre. »*\\n\\nCette bénédiction est transmise **par la Zéra‘**, c’est-à-dire :\\n- par **la foi au Messie**,\\n- par l’**union au peuple de Dieu**,\\n- par la participation à **l’alliance nouvelle**.\\n\\n---\\n\\n## ✦ V. **Une lignée de foi, pas de chair**\\n\\n\u003e **Romains 9.6-8**  \\n\u003e *« Tous ceux qui descendent d’Israël ne sont pas Israël... Ce ne sont pas les enfants de la chair qui sont enfants de Dieu, mais les enfants de la promesse sont comptés comme Zéra‘. »*\\n\\nCela signifie :\\n- Ce n’est pas l’origine biologique qui sauve,\\n- C’est **la foi vivante**, semblable à celle d’Abraham, qui définit la Zéra‘ authentique.\\n\\n---\\n\\n## ✦ VI. **La transmission de la Zéra‘ spirituelle**\\n\\n\u003e **Genèse 18.19**  \\n\u003e *« Je l’ai choisi afin qu’il ordonne à ses fils et à sa maison après lui de garder la voie de l’Éternel… »*\\n\\nLa Zéra‘ est aussi :\\n- **enseignée**,\\n- **transmise** par les pères,\\n- **entendue** par les enfants,\\n- **nourrie** par la Parole de l’Éternel.\\n\\n---\\n\\n## ✦ Conclusion – Héritiers selon la promesse\\n\\nLa **Zéra‘ d’Abraham** est :\\n- **un peuple de foi**, né d’en haut,\\n- **enraciné dans le Messie**,\\n- **bénédiction pour les nations**,\\n- et **appelé à hériter du Royaume éternel**.\\n\\n\u003e **Hébreux 11.12**  \\n\u003e *« C’est pourquoi, d’un seul homme… est née une postérité nombreuse comme les étoiles du ciel. »*\\n\\n\u003e **Galates 3.29**  \\n\u003e *« Si vous êtes au Messie, vous êtes la Zéra‘ d’Abraham. »*\\n\\n---\\n\\nSouhaites-tu maintenant une **fiche comparée entre les trois Zéra‘** (de la femme, d’Abraham, d’Israël) ? Ou préfères-tu continuer avec une autre branche de ton projet (par ex. : le Jardin, le Temple, les arbres) ?\",{},{\"_274\":2429,\"_281\":2446,\"_55\":2447,\"_285\":2448,\"_287\":288,\"_290\":291,\"_292\":2449,\"_294\":295},\"d09e6565-3447-419c-93d9-67c8ac4bc127\",[2420],{\"_416\":472,\"_292\":2451},1754408055.115556,{\"_411\":412,\"_413\":2450},{\"_464\":14,\"_319\":2438,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2402],{},{\"_274\":2444,\"_281\":2455,\"_55\":2456,\"_285\":2457,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2458,\"_294\":295},\"a75b56de-72c4-40f5-a11a-7a2b90aba737\",[2429],{\"_416\":417,\"_292\":2466},1754407599.577462,{\"_411\":412,\"_413\":2464},{\"_298\":2459,\"_300\":34,\"_301\":2460,\"_303\":2461,\"_319\":2462,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2453,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2463},[],[],\"96a750685b44a27f-YUL\",[410],[2465],\"Voici la **fiche sœur** à intégrer dans ton livre sur le symbolisme biblique, liée à la fiche principale **Zéra‘ – La Semence** :\\n\\n---\\n\\n# ✦ **Zéra‘ de la femme (זֶרַע הָאִשָּׁה)**  \\n### Genèse 3.15 – La promesse d’une semence rédemptrice\\n\\n---\\n\\n## ➤ **Verset-clé**\\n\\n\u003e **Genèse 3.15**  \\n\u003e *« Je mettrai inimitié entre toi (le serpent) et la femme, entre ta זֶרַע et sa זֶרַע ; elle t’écrasera la tête, et tu lui blesseras le talon. »*\\n\\nCe verset constitue la **première prophétie messianique explicite** dans la Bible. Il contient **une promesse divine de délivrance** au travers d'une **Zéra‘ spéciale, unique**, appelée **Zéra‘ de la femme**.\\n\\n---\\n\\n## ✦ I. **Un mystère de semence sans homme**\\n\\nContrairement à la logique naturelle, **c’est la femme** qui porte ici une **Zéra‘**, sans mention d’un homme. Cela annonce **une conception surnaturelle** :\\n- Ce n’est pas la semence d’Adam,\\n- C’est **une œuvre directe de Dieu** (cf. Luc 1.35 – l’Esprit viendra sur toi…).\\n\\n\u003e Cette Zéra‘ est **mise à part**, **hors de la corruption adamique**, **purifiée**, **sainte**.\\n\\n---\\n\\n## ✦ II. **Une semence contre le mal**\\n\\nL’inimitié divine est **entre deux Zéra‘** :\\n- **Zéra‘ du serpent** : lignées rebelles, œuvre de l’adversaire, mensonges, orgueil, pouvoir religieux ou politique corrompu.\\n- **Zéra‘ de la femme** : lignée du **Messie**, porteur de justice, vérité, lumière et obéissance.\\n\\nLe combat entre ces deux semences traverse toute la Bible :\\n- Caïn contre Abel,\\n- Ismaël contre Isaac,\\n- Ésaü contre Jacob,\\n- Pharaon contre Moïse,\\n- Hérode contre Yeshoua.\\n\\n---\\n\\n## ✦ III. **Le rôle prophétique de la femme**\\n\\nLa femme devient :\\n- **porteuse de la promesse**,\\n- **figure de la foi**,\\n- **signe de la délivrance**.\\n\\n\u003e L’**Épouse fidèle** porte en elle la **Zéra‘ céleste**, celle qui vient du Père, par la Parole et l’Esprit.\\n\\n---\\n\\n## ✦ IV. **Accomplissement en Yeshoua haMashiaḥ**\\n\\n1. **Conception virginale** :\\n\u003e Marie (Miryam), en tant que fille d’Israël, reçoit en elle **la Zéra‘ de Dieu**, par l’Esprit Saint (Luc 1.35), sans homme.\\n\\n2. **Victoire sur le serpent** :\\n\u003e Le Messie **brise la tête du serpent** à la croix (Col. 2.15 ; Hébr. 2.14), accomplissant **Genèse 3.15**.\\n\\n3. **Zéra‘ incorruptible** :\\n\u003e Il devient **le premier-né d’une nouvelle création** (1 Pierre 1.23 ; Rom. 8.29).\\n\\n---\\n\\n## ✦ V. **Application spirituelle – Le combat des semences**\\n\\nNous vivons dans un monde où **les deux Zéra‘ continuent de s’opposer** :\\n- Ceux qui vivent selon la chair, la rébellion, l’injustice – **Zéra‘ du serpent**.\\n- Ceux qui sont **nés de nouveau**, de la Parole et de l’Esprit – **Zéra‘ de la femme**, enfants de la promesse.\\n\\n\u003e Galates 4.28 : *« Pour nous, frères, comme Isaac, nous sommes enfants de la promesse. »*\\n\\n---\\n\\n## ✦ VI. **Conclusion – Une semence porteuse de victoire**\\n\\n**Zéra‘ de la femme**, c’est :\\n- une **prophétie fondatrice** du salut,\\n- une **lignée spirituelle**,\\n- une **espérance messianique**,\\n- une **réalité en chacun de ceux qui croient**.\\n\\n\u003e « Le Dieu de paix écrasera bientôt Satan sous vos pieds » (Romains 16.20) — par la **Zéra‘ victorieuse**, engendrée d’en haut.\\n\\n---\\n\\nSouhaites-tu que je continue avec la fiche sœur suivante : **« Zéra‘ d’Abraham »** ?\",{},{\"_274\":2453,\"_281\":2470,\"_55\":2471,\"_285\":2472,\"_287\":288,\"_290\":291,\"_292\":2473,\"_294\":295},\"1d32d410-6da0-42a7-bb17-8c4468ec7516\",[2444],{\"_416\":472,\"_292\":2475},1754407599.2464561,{\"_411\":412,\"_413\":2474},{\"_464\":14,\"_319\":2462,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2402],{},{\"_274\":2468,\"_281\":2479,\"_55\":2480,\"_285\":2481,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2482,\"_294\":295},\"03fcac74-7719-434d-a96d-b870c535ee49\",[2453],{\"_416\":417,\"_292\":2490},1754407530.862519,{\"_411\":412,\"_413\":2488},{\"_298\":2483,\"_300\":34,\"_301\":2484,\"_303\":2485,\"_319\":2486,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2477,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2487},[],[],\"96a74ebafdc7a27f-YUL\",[410],[2489],\"Parfait. Voici la **fiche complète et unifiée** pour ton livre, intitulée :\\n\\n---\\n\\n# ✦ **Zֶרַע (Zéra‘) – La Semence**\\n\\n## ➤ **Définition centrale**\\n\\nLe mot hébreu **זֶרַע (Zéra‘)** signifie littéralement :  \\n**semence, graine, postérité, descendance, lignée**.\\n\\nCe mot fondamental traverse toute l’Écriture depuis **Genèse 1** jusqu’aux prophètes, en passant par les patriarches, pour culminer dans **la promesse du Messie**. Il renferme des **dimensions à la fois naturelles, spirituelles, prophétiques et eschatologiques**.\\n\\n---\\n\\n## ✦ I. **Zéra‘ naturelle – La graine qui nourrit**\\n\\n1. **Semence agricole** :  \\nLa **Zéra‘** désigne la graine semée en terre pour produire la nourriture :\\n- Blé, orge, herbes, arbres fruitiers (Gen. 1.11 ; Gen. 47.23).\\n- Elle est comparée à la **manne** (Nomb. 11.7), signe d’une nourriture donnée d’en haut.\\n\\n2. **Le cycle régulier de la semence** :  \\nUn symbole de **fidélité et d’ordre divin**, la Zéra‘ revient **à sa saison**. C’est un **processus divinement ordonné**.\\n\\n---\\n\\n## ✦ II. **Zéra‘ spirituelle – La semence comme symbole prophétique**\\n\\n1. **Le verbe זָרַע** (zara‘) :  \\n- signifie **répandre, semer, planter**.\\n- Employé pour :  \\n  • semer la justice (**Prov. 11.18**),  \\n  • semer la lumière pour les justes (**Ps. 97.11**),  \\n  • répandre Israël parmi les nations (**Zach. 10.9**).\\n\\n2. **Croissance d’Israël** :  \\nDans les prophètes, **Zéra‘** devient une **image de prospérité future**, d’**expansion rapide**, et de **restauration spirituelle** (Éz. 36.9).\\n\\n3. **Zéra‘ étrangère ou corrompue** :  \\nCertaines semences sont jugées **impures** :\\n- **זֶרַע זָר** : rejeton étranger (Is. 17.10),\\n- **זִרְמָה** : sperme bestial (Ez. 23.20),\\n- **זֶרַע מְרֵעִים** : postérité de méchants (Is. 1.4).\\n\\n---\\n\\n## ✦ III. **Zéra‘ humaine – Transmission de la vie**\\n\\n1. **Semence virile** (שִׁכְבַת־זֶרַע) :  \\nSource de fécondité (Lév. 15.16), moyen de reproduction.\\n\\n2. **Descendance humaine** :\\n- Un enfant est une **Zéra‘**, porteur de lignée.\\n- Cette descendance peut être :\\n  • **individuelle** : fils, petits-fils,  \\n  • **familiale** : famille royale (**זֶרַע הַמֶּלֶךְ**),  \\n  • **nationale** : **Zéra‘ Israël** (Ps. 22.24),  \\n  • **prophétique** : **Zéra‘ des justes**, **de David**, **d’Abraham**.\\n\\n3. **Nom divin de la postérité** :  \\nDieu **donne** (**נָתַן**) ou **suscite** (**הֵקִים**) une Zéra‘ pour continuer une lignée bénie (cf. David, Aaron, Phinéas...).\\n\\n---\\n\\n## ✦ IV. **Zéra‘ messianique – La promesse d’une semence rédemptrice**\\n\\n### ✧ Genèse 3.15 — La Zéra‘ de la femme :\\n\u003e « Je mettrai inimitié entre toi et la femme, entre ta Zéra‘ et sa Zéra‘ ; elle t’écrasera la tête… »\\n\\nC’est la **première annonce du Messie**, appelé **Zéra‘ de la femme**.  \\n→ Une **semence surnaturelle**, non issue d’homme (cf. Luc 1.35), qui vient **vaincre le mal à la racine**.\\n\\n---\\n\\n## ✦ V. **Zéra‘ collective – Le peuple selon l’alliance**\\n\\n1. **Zéra‘ d’Israël** :  \\n- Collectivement, le mot désigne **le peuple élu**, issu de la foi d’Abraham, **porteur de l’alliance** (Gen. 17 ; Is. 59.21).\\n\\n2. **Zéra‘ future** :  \\n- Les prophètes parlent à **la Zéra‘ d’Israël à venir** : les **générations futures** qui entendront l’appel divin (Joël 2.28).\\n\\n3. **Zéra‘ fidèle vs Zéra‘ impie** :  \\n- Ceux qui gardent la Parole sont appelés **Zéra‘ de justice**, tandis que les idolâtres sont **Zéra‘ de malfaisants** (Is. 1.4).\\n\\n---\\n\\n## ✦ Conclusion : La Semence vivante et éternelle\\n\\n**Zéra‘** est plus qu’un mot : c’est **un mystère du Royaume**.\\n\\n- Elle peut être **visible (biologique)** ou **invisible (spirituelle)**.\\n- Elle est **porteuse de destinée** : bénédiction ou malédiction.\\n- Elle est **plantée par Dieu**, grand Semeur, dans **les cœurs** comme dans **l’histoire**.\\n\\n\u003e « Le semeur sème la parole… Ceux qui la reçoivent dans un bon cœur portent du fruit » (Marc 4.14-20).  \\n\u003e « La semence incorruptible, c’est la Parole vivante et permanente de Dieu » (1 Pierre 1.23).\\n\\n---\\n\\nSouhaites-tu maintenant que je passe à la fiche sœur : **« Zéra‘ de la femme »** ?\",{},{\"_274\":2477,\"_281\":2494,\"_55\":2495,\"_285\":2496,\"_287\":288,\"_289\":34,\"_290\":363,\"_292\":2497,\"_294\":295},\"250e1d47-e6e1-4956-ba65-34d1563c51ac\",[2468],{\"_416\":450,\"_292\":2499},1754407530.8365867,{\"_411\":412,\"_413\":2498},{\"_1068\":34,\"_319\":2486,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2492,\"_2327\":2328,\"_447\":34,\"_329\":10,\"_327\":14},[449],{},{\"_274\":2492,\"_281\":2503,\"_55\":2504,\"_285\":2505,\"_287\":288,\"_290\":291,\"_292\":2506,\"_294\":295},\"ba9ea4f9-1c57-4ec1-8281-628f4e9e46f7\",[2477],{\"_416\":472,\"_292\":2508},1754407530.5275888,{\"_411\":412,\"_413\":2507},{\"_464\":14,\"_319\":2486,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2402],{},{\"_274\":2501,\"_281\":2512,\"_55\":2513,\"_285\":2514,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2515,\"_294\":295},\"d33c09aa-e7f6-4a61-9470-e1f2dfee3592\",[2492],{\"_416\":417,\"_292\":2523},1754407503.614025,{\"_411\":412,\"_413\":2521},{\"_298\":2516,\"_300\":34,\"_301\":2517,\"_303\":2518,\"_319\":2519,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2510,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2520},[],[],\"96a74e0fd9c1a27f-YUL\",[410],[2522],\"Voici un **résumé condensé et approfondi** de ce texte afin de faire ressortir le **sens spirituel et prophétique du mot זֶרַע (Zéra‘)** :\\n\\n---\\n\\n## **Zéra‘ (זֶרַע) — La Semence : un concept de vie, d’alliance et de postérité**\\n\\n### 1. **Sens littéral et naturel**\\nLe mot **זֶרַע** signifie :\\n- **Graine ou semence agricole** : blé, orge, herbes, arbres (Gen. 1.29).  \\n- **Ensemencement saisonnier** : processus régulier qui assure la subsistance.  \\n- **Produit de la semence** : la récolte, la manne (comparée au **Zéra‘** de coriandre, Nomb. 11.7).  \\n\\nLa **semence**, dans ce sens, est **porteuse de vie** et **symbole de renouvellement**.\\n\\n---\\n\\n### 2. **Sens figuré et spirituel**\\n**Zéra‘** est utilisé pour :\\n- **La prospérité d’Israël** : comme une semence qui croît rapidement et abondamment (Is. 61.11).  \\n- **Le jugement ou l’idolâtrie** : l’action de semer des pratiques contraires à Dieu (Jér. 12.13).  \\n- **La justice** : \\\"Celui qui **sème la justice**\\\" (**Prov. 11.18**) — image d’une récolte spirituelle.\\n\\n---\\n\\n### 3. **Zéra‘ = vie et descendance**\\n**Zéra‘** représente :\\n- **La semence virile** (שִׁכְבַת־זֶרַע) — source de vie.  \\n- **La postérité** : fils, petits-fils, générations (Is. 59.21).  \\n- **La lignée des patriarches** : Zéra‘ d’Abraham, de Jacob, de David — **lignée messianique**.  \\n- **Le peuple d’Israël** : **Zéra‘ Israël** (Ps. 22.24), représentant l’alliance vivante.\\n\\n---\\n\\n### 4. **Zéra‘ de la femme et promesse messianique**\\nDans **Gen. 3.15**, Dieu annonce que **la Zéra‘ de la femme** écrasera la tête du serpent.  \\n\u003e Cette **Zéra‘ unique** désigne **le Messie**, semence spirituelle et divine, qui renversera le mal.\\n\\n---\\n\\n### 5. **Zéra‘ comme identité collective**\\nLe terme peut aussi désigner :\\n- **Une famille, une maison royale** : **זֶרַע הַמֶּלֶךְ** (la semence royale).  \\n- **Un peuple** : une nation définie par le **même sang** ou la même alliance.  \\n- **Une communauté morale** :  \\n  - en **bon sens** : les justes (semence bénie),  \\n  - en **mauvais sens** : **זֶרַע מְרֵעִים** (Is. 1.4), une communauté de malfaiteurs.\\n\\n---\\n\\n### 6. **Dieu, le semeur de la vie**\\nLes Écritures décrivent Dieu comme celui qui **donne** (**נָתַן**) ou **maintient la semence en vie** (**חִיָּה זֶרַע**).  \\nCette action s’étend :\\n- aux animaux,\\n- aux hommes et aux femmes,\\n- à la **survie du peuple choisi**.\\n\\n---\\n\\n### **Conclusion : Zéra‘, un mystère de vie et de Royaume**\\n**Zéra‘** ne se limite pas à une graine physique. C’est :\\n- **la promesse d’une lignée**,  \\n- **le signe d’une alliance**,  \\n- **le canal de la bénédiction divine**,  \\n- **l’annonce prophétique du Messie**.  \\n\\n\u003e Celui qui **reçoit et garde la bonne semence** (Matt. 13.23) devient porteur du Royaume.\\n\\n---\\n\\nVeux-tu que je **fusionne ce résumé avec le précédent**, afin de créer une **fiche finale \\\"Zéra‘ – La Semence\\\"**, complète et bien structurée pour ton livre ?\",{},{\"_274\":2510,\"_281\":2527,\"_55\":2528,\"_285\":2529,\"_287\":288,\"_290\":291,\"_292\":2530,\"_294\":295},\"638c03c2-f685-4e9e-9cd5-75cc609a9e19\",[2501],{\"_416\":417,\"_292\":2531},1754407503.6038315,{\"_411\":1039,\"_1040\":449},{\"_328\":2525,\"_329\":10,\"_632\":34},{},{\"_274\":2525,\"_281\":2535,\"_55\":2536,\"_285\":2537,\"_287\":288,\"_289\":34,\"_290\":363,\"_292\":2538,\"_294\":295},\"3ecd8f5f-b08f-4a4e-974a-09ad00c3584b\",[2510],{\"_416\":450,\"_292\":2540},1754407503.5217073,{\"_411\":412,\"_413\":2539},{\"_1068\":34,\"_319\":2519,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2533,\"_2327\":2328,\"_447\":34,\"_329\":10,\"_327\":14},[449],{},{\"_274\":2533,\"_281\":2544,\"_55\":2545,\"_285\":2546,\"_287\":288,\"_290\":291,\"_292\":2547,\"_294\":295},\"751a56d3-6e2f-4d9f-9c17-f9306c26ead4\",[2525],{\"_416\":472,\"_292\":2550},1754407503.081791,{\"_411\":412,\"_413\":2548},{\"_464\":14,\"_319\":2519,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2549],\"Peux tu me résumer ce texte provenant d’une autre source, ce qui suit de la même façon afin de faire ressortir le sens profond du mot zéro : זֶרַע‎\\nזֶרַע‎ n.m. semence, graine, descendance —\\n\\nSens littéral :\u2028a. un ensemencement, d’où\u2028b. ensemencement comme phénomène régulier revenant à sa saison.\\nGraine :\u2028a. littéralement, semée pour produire des récoltes alimentaires, habituellement du blé, de l’orge, etc.\u2028b. figuré, de l’idolâtrie de Juda ; des fortunes de Sion — l’action de répandre la semence, c’est-à-dire la quantité appropriée pour semer ;\u2028— comme produisant la récolte, au sens figuré d’une croissance rapide et abondante dans le temps à venir ;\u2028— concernant la croissance et la prospérité d’Israël.\u2028c. Zéra‘ comme produit :\u2028— la manne est comparée avec זֶרַע de coriandre ;\u2028— semence d’herbes et d’arbres.\u2028d. En particulier, זֶרַע comme produit céréale, récolte de grains (bien que ce ne soit pas toujours clairement distingué).\\nZéra‘ = semence virile :\u2028— habituellement שִׁכְבַת־זֶרַע, écoulement de semence ;\u2028— comme accusatif de manière (accusatif de mode).\\nZéra‘ = descendance :\u2028a. rarement utilisé pour les animaux, collectivement.\u2028b. généralement pour les humains, collectivement = descendants, postérité ;\u2028— Zéra‘ de la femme ;\u2028— Zéra‘ des patriarches (en particulier Abraham) ;\u2028— = un fils en tant que porteur de postérité.\u2028c. Zéra‘ (= postérité) d’autres individus :\u2028— en particulier Zéra‘ de David comme oint pour régner, comme assis sur le trône ;\u2028— de Yekonya (Jehoïakin), Yehoyaqim (Jehoïakim) ;\u2028— d’un enfant (fils) en tant que porteur de postérité ;\u2028— de Zéra‘ de Noé et de ses fils ;\u2028— d’Aaron ;\u2028— de Phinéas ;\u2028— de David ;\u2028— du Zéra‘ des justes.\u2028d. spécifiquement d’un enfant particulier (fils), enfants et petits-enfants.\u2028e. = famille ; en particulier famille royale : זֶרַע הַמֶּלֶךְ ;\u2028— = généalogie ;\u2028— = nation d’appartenance, en tant que sang commun.\\nCertains verbes utilisés avec זֶרַע dans ces sens sont :\\n(référence aux formes verbales accompagnant les différents usages, non développée ici)\\nנָתַן (Dieu comme sujet) (suivi de מִן pour désigner la femme) ;\\nשִׂים ;\\navec l’homme comme sujet : נָתַן ;\\nהֵקִים ;\\nחִיָּה זֶרַע — maintenir en vie, ou donner la vie à, utilisé pour :\\n• les animaux ;\\n• la femme (suivi de מִן pour désigner l’homme).\\nf. Particulièrement : utilisé comme nom pour le peuple d’Israël, Zéra‘ d’Abraham ; d’Israël ou de Jacob.\\ng. Zéra‘ d’Israël (ou de Jacob, ou du peuple), est aussi employé, par les prophètes (postérieurs), pour désigner les générations futures, lorsqu’ils s’adressent au peuple ; également utilisé pour désigner les Juifs.\\nZéra‘ comme marqué par une qualité morale = personnes (ou communauté) ayant une telle qualité :\u2028• dans un bon sens ;\u2028• dans un mauvais sens : זֶרַע מְרֵעִים, communauté de malfaiteurs / faiseurs de mal.\",{},{\"_274\":2542,\"_281\":2554,\"_55\":2555,\"_285\":2556,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2557,\"_294\":295},\"068be156-323d-48d7-8abf-30fc86d70e47\",[2533],{\"_416\":417,\"_292\":2565},1754405548.358383,{\"_411\":412,\"_413\":2563},{\"_298\":2558,\"_300\":34,\"_301\":2559,\"_303\":2560,\"_319\":2561,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2552,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2562},[],[],\"96a71e267eb8a308-YUL\",[410],[2564],\"C’est noté. Je vais donc préparer les trois fiches suivantes pour ton livre :\\n\\n1. **Zéra‘ – La Semence** : fiche centrale, avec tous les sens bibliques, naturels et prophétiques du mot זֶרַע.  \\n2. **Zéra‘ de la femme** : fiche prophétique centrée sur Genèse 3.15, lien avec la promesse messianique.  \\n3. **Zéra‘ d’Abraham** : fiche sur la postérité d’Abraham, physique et spirituelle, et son accomplissement en Israël et dans le Messie.\\n\\nSouhaites-tu que je commence tout de suite à rédiger la première fiche ?\",{},{\"_274\":2552,\"_281\":2569,\"_55\":2570,\"_285\":2571,\"_287\":288,\"_290\":291,\"_292\":2572,\"_294\":417},\"eaba6623-8229-47d0-a262-9dce4bf82482\",[2542],{\"_416\":635,\"_636\":2574,\"_292\":2575},1754405548.3715115,{\"_411\":412,\"_413\":2573},{\"_328\":2567,\"_329\":10,\"_632\":34},[634],\"bio\",{},{\"_274\":2567,\"_281\":2579,\"_55\":2580,\"_285\":2581,\"_287\":288,\"_289\":14,\"_290\":291,\"_292\":2582,\"_294\":2574},\"a9fc0319-f770-45c0-916b-cfd9dea3b084\",[2552],{\"_416\":417,\"_292\":2585},1754405541.1019,{\"_411\":412,\"_413\":2583},{\"_328\":2577,\"_329\":10,\"_632\":34},[2584],\"This code was redacted.\",{},{\"_274\":2577,\"_281\":2589,\"_55\":2590,\"_285\":2591,\"_287\":288,\"_290\":291,\"_292\":2592,\"_294\":295},\"7cf896d4-3716-4bbc-ac0e-39a33b65cceb\",[2567],{\"_416\":472,\"_292\":2594},1754405540.631289,{\"_411\":412,\"_413\":2593},{\"_464\":14,\"_319\":2561,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2402],{},{\"_274\":2587,\"_281\":2598,\"_55\":2599,\"_285\":2600,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2601,\"_294\":295},\"11608e05-8368-499b-b1d3-eb76e138d574\",[2577],{\"_416\":417,\"_292\":2609},1754405471.557005,{\"_411\":412,\"_413\":2607},{\"_298\":2602,\"_300\":34,\"_301\":2603,\"_303\":2604,\"_319\":2605,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2596,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2606},[],[],\"96a71c702b08a308-YUL\",[410],[2608],\"Voici un **résumé structuré et profond** du texte que tu as fourni, mettant en lumière le **mot hébreu זֶרַע (Zéra‘)** dans **sa richesse biblique, symbolique et prophétique**, tel qu’il apparaît dans les Écritures. J’ai aussi inclus les dérivés, racines et mots apparentés, tout en **laissant les mots hébreux originaux tels quels**, comme demandé.\\n\\n---\\n\\n## ✦ Résumé sur **זֶרַע** — La Semence selon le sens profond des Écritures\\n\\n### 1. **Sens fondamental et biologique**\\nLe mot **זֶרַע** signifie d’abord :\\n- **Semence végétale**, graine porteuse de vie (Gen. 1.11 : כָּל־עֵשֶׂב זֹרֵעַ זֶרַע – toute herbe qui porte sa graine).\\n- **Semence agricole** semée en terre pour nourrir le peuple (Gen. 47.23 ; Jér. 12.13).\\n\\nElle représente la **source visible et tangible de vie**, dont le but est la **fructification**.\\n\\n---\\n\\n### 2. **Racine verbale זָרַע — semer, répandre, planter**\\nLe verbe **זָרַע** exprime l’action divine et humaine de :\\n- répandre (Zach. 10.9 – וְאֶזְרָעֵם בָּעַמִּים : Je les sèmerai parmi les nations),\\n- semer la justice (**Prov. 11.18** : וְזֹרֵעַ צְדָקָה),\\n- semer la lumière (**Ps. 97.11** : אוֹר זָרֻעַ לַצַּדִּיק – la lumière est semée pour le juste).\\n\\nCe verbe est **profondément prophétique**, car il exprime l’**initiative divine** de répandre la vie, la bénédiction, la justice, la révélation — **dans les cœurs, dans le monde, dans l’histoire**.\\n\\n---\\n\\n### 3. **Zéra‘ = Descendance humaine et lignage spirituel**\\n**זֶרַע** désigne :\\n- la **semence virile** (au sens biologique),\\n- mais aussi la **postérité** (Gen. 3.15 – וּבֵין זַרְעֲךָ וּבֵין זַרְעָהּ – ta semence et la sienne),\\n- les **descendants d’une lignée** : **Zéra‘ d’Abraham**, **Zéra‘ d’Israël**, **Zéra‘ du roi** (1 Sam. 8.15 ; Is. 59.21 ; Ps. 22.24).\\n\\nElle peut désigner une **génération physique**, mais aussi une **lignée spirituelle**, selon le cœur et l’alliance avec Dieu.\\n\\n---\\n\\n### 4. **Zéra‘ dans la promesse messianique**\\nLa **prophétie de Genèse 3.15** présente **la semence de la femme** comme celle qui écrasera la tête du serpent :\\n\u003e Cette **Zéra‘** est une figure messianique, **unique**, **incarnée dans le Messie Yeshoua**, né d’une femme, sans intervention d’homme.\\n\\nCela montre que **la Semence véritable**, dans le plan de Dieu, est **surnaturelle**, **mise à part**, **porteuse de salut**.\\n\\n---\\n\\n### 5. **Zéra‘ corrompue et jugée**\\nLe mot peut aussi désigner une semence **impure, idolâtre ou bestiale**, selon :\\n- **זִרְמָה** (Ez. 23.20) : semence animale, image de passions dépravées ;\\n- **זֶרֶם** (Is. 28.2) : torrent destructeur, pluie torrentielle, jugement ;\\n- **זֶרַע זָר** (Is. 17.10) : rejeton étranger, semence non consacrée.\\n\\nAinsi, **toute semence n’est pas approuvée par Dieu** : seules celles qui Lui sont soumises peuvent porter du fruit pour le Royaume.\\n\\n---\\n\\n### 6. **Formes et dérivés**\\n- **זֶרַח (Zéraḥ)** : nom propre dérivé, signifiant « celui qui brille, qui luit » (Gen. 38.30, fils de Juda) — **peut évoquer la semence glorieuse, l’espoir visible**.\\n- **זַרְחִי**, **זְרַחְיָה** : dérivés patronymiques et théophores liés à זֶרַח.\\n- **זָרַם**, **זֶרֶם** : notion d’inondation — **la semence mauvaise devient déluge**.\\n- **זֵרֹעִים / זֵרְעֹנִים** : graines, légumes, nourriture végétale donnée à ceux qui refusent de se souiller (Dan. 1.12, 16).\\n\\n---\\n\\n### 7. **La terre préparée pour la Zéra‘**\\nDans Ezéchiel 36.9 :  \\n\u003e « Vous serez labourées et ensemencées » (**וְנֶעֱבַדְתֶּם וְנִזְרַעְתֶּם**)  \\nC’est une image de **la restauration d’Israël**, dont **la terre (symbolique des cœurs)** sera **réceptive à la bonne semence**.\\n\\n---\\n\\n### ✦ Conclusion : Zéra‘, une semence divine, humaine et messianique\\n\\nLe mot **זֶרַע** contient en lui :\\n- **l’origine de la vie** (biologique),\\n- **le mystère de la transmission** (spirituelle),\\n- **la promesse de l’alliance** (Abraham, Israël),\\n- **l’espérance du Messie** (Gen. 3.15),\\n- et le **discernement entre ce qui est pur et impur**, entre la **Zéra‘ de Dieu** et la **Zéra‘ étrangère**.\\n\\n\u003e « Celui qui sème pour l'Esprit moissonnera de l'Esprit la vie éternelle » (cf. Galates 6.8 – en lien profond avec le verbe זָרַע).\\n\\n---\\n\\nSouhaites-tu que je transforme ce résumé en **fiche pour ton livre**, avec une fiche sœur sur **« Zéra‘ de la femme »** et **« Zéra‘ d’Abraham »** ?\",{},{\"_274\":2596,\"_281\":2613,\"_55\":2614,\"_285\":2615,\"_287\":288,\"_290\":291,\"_292\":2616,\"_294\":295},\"c0171c6e-f8ee-4b4f-af44-388505edc49b\",[2587],{\"_416\":472,\"_292\":2619},1754405470.112534,{\"_411\":412,\"_413\":2617},{\"_464\":14,\"_319\":2605,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2618],\"Peux tu ma faire un résumé de ce texte afin que le mot Semence soit bien exprimer selon le sens profond des écritures svp : זֶרַח‎ n. pr. 1° Zerah, fils de Juda et de Thamar, Gen. 38. 30, Nomb. 26. 20. — 2° Fils de Reouel, 36. 13. — 3° Fils de Siméon, Nomb. 26. 13. — 4° Fils de Gerson, I Chr. 6.6. — 5° Zerah l’Éthiopien, II Chr. 14. 8.\\nזַרְחִי‎ nom patron. de זֶרַח‎ Nomb. 26. 13, 20.\\nזְרַחְיָה‎ n pr. m. 1° I Chr. 5. 32. — 2° Esdr. 8. 4.\\nזָרַם Couler, inonder, emporter: זְרַמְתָּם שֵׁנָה יִהְיוּ‎ Ps. 90. 5, tu les emportes comme un torrent, ils sont comme un sommeil, s’évanouissent comme un rêve.\\nPi. ou Pou.: זֹרְמוּ מַיִם עָבוֹת‎ Ps. 77. 18, les nuées ont versé de l’eau par torrents.\\nזֶרֶם‎ m. Pluie forte, averse: כְּזֶרֶם מַיִם כַּבִּירִים‎ Is. 28. 2, comme l’inondation causée par un déluge d’eau; כְּזֶרֶם בָּרָד‎ 28.2, comme une pluie mêlée de grêle; כְּזֶרֶם קִיר‎ 25. 4, comme une pluie d’orage (à renverser) les murs; (des comment. expliquent dans le même sens כְּמַהְפֵּכַת זָרִים‎ Is. 1. 7, comme la destruction causée par une tempête, au lieu de: destruction faite par des étrangers, barbares; v. זָר‎).\\nזִרְמָה‎ f. Semence, sperme: וְזִרְמַת סוּסִים‎ זִרְמָתָם‎ Ez. 23. 20, et leur semence est comme la semence des chevaux, leurs passions sont bestiales.\\nזָרַע‎ (fut. יִזְרַע) Répandre, disperser, semer, planter: וְאֶזְרָעֵם בָּעַמִּים‎ Zach. 10. 9, je les répandrai parmi les peuples; זָרְעוּ חִטִּים‎ Jér. 12. 13, ils ont semé du froment; וּזְרַעְתֶּם אֶת־הָאֲדָמָה‎ Gen. 47, 23, ensemencez la terre; כָּל־עֵשֶׂב זֹרֵעַ זֶרַע‎ 1. 29, chaque herbe qui porte en elle la graine; au fig.: וְזֹרֵעַ צְדָקָה‎ Prov. 11. 18, celui qui sème la justice; אוֹר זָרֻעַ לַצַּדִּיק‎ Ps. 97. 11, la lumière (félicité) est semée pour le juste, c.-à-d. attend le juste; וּזְמֹרַת זָר תִּזְרָעֶנּוּ‎ Is. 17. 10, et tu y as planté un rejeton étranger.\\nNiph.: וְנֶעֱבַדְתֶּם וְנִזְרַעְתֶּם‎ Ez. 36.9, vous serez labourées et ensemencées; לֹא־יִזָּרַע מִשִּׁמְךָ עוֹד‎ Nah. 1. 14, il ne restera plus désormais aucun souvenir de ton nom, ou: aucun de tes enfants ne portera plus ton nom, tes titres; וְנִזְרְעָה זָרַע‎ Nomb. 5. 28, et elle concevra, elle aura des enfants.\\nPou.: אַף בַּל־זֹרָעוּ‎ Is. 40.24, et ils n’ont pas été semés.\\nHiph.: עֵשֶׂב מַזְרִיעַ זֶרַע‎ Gen. 1. 11, de l’herbe qui porte, produit, la graine; אִשָּׁה כִּי תַזְרִיעַ‎ Lév. 12. 1, une femme qui conçoit.\\nזֶרַע‎ m. (avec suff. זַרְעִי‎, plur. avec suff. זַרְעֵיכֶם). Semence, graine, récolte, enfant, race, peuple: אֲשֶׁר זַרְעוֹ־בוֹ‎ Gen. 1. 11, en qui se trouve sa graine; הֵא־לָכֶם זֶרַע‎ 47. 23, voici pour vous de la semence; וְזַרְעֵיכֶם וְכַרְמֵיכֶם יַעְשׂר‎ I Sam. 8. 15, et de vos récoltes et de vos vignes il prendra la dîme; וּבֵין זַרְעֲךָ וּבֵין זַרְעָהּ‎ Gen. 3. 15, entre tes enfants et sa race; זֶרַע זַרְעֲךָ‎ Is. 59. 21, tes petits-fils; une fois const. כִּזְרַע־גַּד הוּא ׃זְרַע‎ Nomb. 11. 7, (la manne) était comme la graine de coriandre; כָּל־זֶרַע יִשְׂרָאֵל‎ Ps. 22. 24, tout le peuple d’Israel.\\nזְרַע‎ chald. Même signif. que זֶרַע‎: בִּזְרַע אֲנָשָׁא‎ Dan. 2. 43, avec la semence, le sang humain.\\nזֵרֹעִים‎ m. pl. Légumes: וְיִתְּנוּ־לָנוּ מִן־ הַזֵּרֹעִים‎ Dan. 1. 12, qu’on nous donne des légumes.\\nזֵרְענִֹים‎ m. pl. Légumes: וְנֹתֵן לָהֶם זֵרְעֹנִים‎ Dan. 1. 16, et il leur donna des légumes.\\n\",{},{\"_274\":2611,\"_281\":2623,\"_55\":2624,\"_285\":2625,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2626,\"_294\":295},\"fe8d2c29-8bad-4d3d-a7ed-9907ff2984bd\",[2596],{\"_416\":417,\"_292\":2634},1754405407.511176,{\"_411\":412,\"_413\":2632},{\"_298\":2627,\"_300\":34,\"_301\":2628,\"_303\":2629,\"_319\":2630,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2621,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2631},[],[],\"96a71ad83a13a2d4-YUL\",[410],[2633],\"Voici un **résumé profond et fidèle** de tout ce passage lexical, organisé pour exprimer **le mot « semence » (זֶרַע)** dans sa **richesse symbolique, spirituelle et scripturaire**, selon ta demande — **en gardant les mots hébreux** là où leur emploi est significatif :\\n\\n---\\n\\n### ✦ **Résumé sur le mot זֶרַע (Zéra‘) — La Semence dans les Écritures**\\n\\nLe mot hébreu **זֶרַע** est un terme **clé** dans la pensée biblique, porteur de **dimensions à la fois naturelles, spirituelles, prophétiques et messianiques**.\\n\\n---\\n\\n### 1. **Origine et Sens Littéral**\\nLe mot **זֶרַע** désigne en premier lieu :\\n- la **graine végétale** qu’on sème (**Gen. 1.11**),\\n- la **semence agricole** utilisée pour nourrir (blé, orge, herbes, etc.),\\n- le **geste de semer** lui-même (**זָרַע**, \\\"répandre, semer, planter\\\").\\n\\nCe mot englobe donc à la fois le **principe vital**, le **mouvement** de transmission, et le **fruit attendu**.\\n\\n---\\n\\n### 2. **Semence humaine et postérité**\\nDans une portée humaine, **זֶרַע** signifie aussi :\\n- la **semence virile** (**שִׁכְבַת־זֶרַע**) : source de vie selon la chair ;\\n- la **descendance, postérité, race** (ex. : **Gen. 3.15**, **זַרְעָךָ** = ta postérité).\\n\\nCela s’applique :\\n- à l’homme et à la femme dans l’union féconde (**Lév. 12.1**) ;\\n- aux **patriarches**, comme Abraham, à qui Dieu promet une **postérité innombrable** (**Gen. 15**) ;\\n- au **peuple d’Israël** désigné souvent comme **זֶרַע יִשְׂרָאֵל** (Ps. 22.24), la semence collective du plan divin.\\n\\n---\\n\\n### 3. **La semence comme peuple et lignée spirituelle**\\n**זֶרַע** devient dans les Écritures :\\n- le **symbole d’un peuple appelé à porter une promesse** ;\\n- une **lignée choisie**, souvent associée à **David** (ex. : **זֶרַע הַמֶּלֶךְ**, la semence royale).\\n\\nLa **postérité** n’est pas qu’une transmission biologique, mais une **continuation de l’alliance**, un **canal messianique**.\\n\\n---\\n\\n### 4. **La semence dans le jugement et la promesse**\\nLa **semence de la femme** (**Gen. 3.15**) est prophétique :\\n\u003e \\\"Je mettrai inimitié entre toi (le serpent) et la femme, entre ta זֶרַע et sa זֶרַע ; elle t’écrasera la tête…\\\"\\n\\nC’est là la **prophétie du Messie**, celui qui naîtrait d’une femme et **vaincrait le mal**. La **Zéra‘** devient **espérance**.\\n\\n---\\n\\n### 5. **La semence dans l’idolâtrie ou la corruption**\\nLe mot peut aussi désigner :\\n- une **semence étrangère** ou corrompue (**Is. 17.10**) ;\\n- une **race de malfaisants** (**זֶרַע מְרֵעִים**, Is. 1.4) ;\\n- des passions bestiales (**זִרְמָה**, Ez. 23.20).\\n\\nCe contraste souligne que **toute semence porte une nature** : soit **juste** et féconde, soit **étrangère** et destructrice.\\n\\n---\\n\\n### 6. **Semence spirituelle et fruit**\\nPlusieurs passages utilisent **זָרַע** au **sens figuré** :\\n- Celui qui **sème la justice** (**Prov. 11.18**) ;  \\n- La **lumière semée pour les justes** (**Ps. 97.11**) ;  \\n- L’alliance transmise de **génération en génération** (**Is. 59.21**) ;\\n- L’image de la **semence implantée dans la terre des cœurs** prête à porter du fruit en son temps (**Jér. 12.13**).\\n\\n---\\n\\n### 7. **Formes apparentées**\\n- **זָרַם** : inonder, emporter comme un torrent — image du jugement ou du passage soudain (Ps. 90.5).\\n- **זֶרֶם** : pluie forte ou déluge, image de force destructrice ou de purification.\\n- **זֵרְעֹנִים / זֵרֹעִים** : graines, semences comestibles (Dan. 1.12, 16) — nourriture saine, symbolique de pureté et fidélité.\\n\\n---\\n\\n### ✦ Conclusion : זֶרַע, une image du Royaume\\nLe mot **זֶרַע** n’est pas simplement biologique : il est **prophétique, spirituel, porteur d’alliance, porteur de vie ou de ruine** selon la nature de ce qui est semé.\\n\\n\u003e Le Royaume de Dieu est **comme une semence** (cf. Marc 4), cachée, mais puissante, qui grandit dans le cœur préparé.\\n\\n---\\n\\nSouhaites-tu que je transforme ce résumé en **fiche pour ton livre** ? Je peux aussi créer une fiche sœur sur « **Zéra‘ de la femme** » et une autre sur « **Zéra‘ d’Abraham** ».\",{},{\"_274\":2621,\"_281\":2638,\"_55\":2639,\"_285\":2640,\"_287\":288,\"_290\":291,\"_292\":2641,\"_294\":295},\"65337d22-739a-42e2-a6b1-75aacce57ae6\",[2611],{\"_416\":472,\"_292\":2643},1754405405.06877,{\"_411\":412,\"_413\":2642},{\"_464\":14,\"_319\":2630,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2618],{},{\"_274\":2636,\"_281\":2647,\"_55\":2648,\"_285\":2649,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2650,\"_294\":295},\"3cabd200-1139-4228-93ef-8f7850f1f99f\",[2621],{\"_416\":417,\"_292\":2658},1754404825.3192,{\"_411\":412,\"_413\":2656},{\"_298\":2651,\"_300\":34,\"_301\":2652,\"_303\":2653,\"_319\":2654,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2645,\"_2327\":2328,\"_329\":10,\"_327\":34},{\"_51\":407,\"_408\":2655},[],[],\"96a70cad3d35a2c2-YUL\",[410],[2657],\"Voici la **traduction en français** fidèle de la suite de l’article lexicographique, avec **les mots hébreux conservés tels quels**, comme demandé :\\n\\n---\\n\\n**נָתַן** (Dieu comme sujet) (suivi de **מִן** pour désigner la femme) ;  \\n**שִׂים** ;  \\navec l’homme comme sujet : **נָתַן** ;  \\n**הֵקִים** ;  \\n**חִיָּה זֶרַע** — maintenir en vie, ou donner la vie à, utilisé pour :  \\n• les animaux ;  \\n• la femme (suivi de **מִן** pour désigner l’homme).\\n\\nf. **Particulièrement :** utilisé comme nom pour le peuple d’Israël, **Zéra‘** d’Abraham ; d’Israël ou de Jacob.\\n\\ng. **Zéra‘** d’Israël (ou de Jacob, ou du peuple), est aussi employé, par les prophètes (postérieurs), pour désigner les générations futures, lorsqu’ils s’adressent au peuple ; également utilisé pour désigner les Juifs.\\n\\n5. **Zéra‘** comme marqué par une qualité morale = personnes (ou communauté) ayant une telle qualité :  \\n• dans un **bon sens** ;  \\n• dans un **mauvais sens** : **זֶרַע מְרֵעִים**, communauté de malfaiteurs / faiseurs de mal.\\n\\n---\\n\\n**Source :**  \\nWhitaker, Richard ; Francis Brown ; S.R. Driver \u0026 Charles A. Briggs.  \\n*The Abridged Brown-Driver-Briggs Hebrew-English Lexicon of the Old Testament*, 1906.\\n\\n---\\n\\nSouhaites-tu que je continue avec un autre extrait ou que je t’intègre cela dans une fiche pour ton livre (par exemple dans un dossier sur les termes liés à la postérité ou à la semence spirituelle) ?\",{},{\"_274\":2645,\"_281\":2662,\"_55\":2663,\"_285\":2664,\"_287\":288,\"_290\":291,\"_292\":2665,\"_294\":295},\"ef98630d-4769-475f-b77d-0630f7cf7675\",[2636],{\"_416\":472,\"_292\":2668},1754404825.053019,{\"_411\":412,\"_413\":2666},{\"_464\":14,\"_319\":2654,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2667],\"Voici la suite à traduire svp : נָתַן, God subj. (sq. מִן of woman); שִׂים; c. man as subj. נתן‎; הֵקִים‎; ˊחִיָּה ז‍‎ keep alive, or give life to, of animals; of woman (sq. מִן of man). f. esp. as name for people of Isr., seed of Abr; of Isr. or Jacob. g. seed of Isr. (or Jacob, or the people), is used also, by (later) prophets, of future generations, in addressing the people; of Jews. 5. seed as marked by moral quality = persons (or community) of such a quality; in good sense; in bad sense מְרֵעִים‎ ˊז‍‎ community of evil-doers.\\nWhitaker, Richard, Francis Brown, S.R. (Samuel Rolles) Driver \u0026 Charles A. (Charles Augustus) Briggs. 1906. The Abridged Brown-Driver-Briggs Hebrew-English Lexicon of the Old Testament: from A Hebrew and English Lexicon of the Old Testament by Francis Brown, S.R. Driver and Charles Briggs, based on the lexicon of Wilhelm Gesenius. Boston; New York: Houghton, Mifflin and Company.\\n\",{},{\"_274\":2660,\"_281\":2672,\"_55\":2673,\"_285\":2674,\"_287\":288,\"_289\":34,\"_290\":291,\"_292\":2675,\"_294\":295},\"91e24ad5-3c98-45ad-8a99-70d5c97c1ff5\",[2645],{\"_416\":417,\"_292\":2681},1754404479.021633,{\"_411\":412,\"_413\":2679},{\"_301\":2676,\"_303\":2677,\"_319\":2678,\"_321\":322,\"_326\":2326,\"_67\":1093,\"_328\":2670,\"_2327\":2328,\"_329\":10,\"_327\":34},[],[],\"96a7042a5a87a284-YUL\",[2680],\"Voici la traduction fidèle en français de ton extrait, en conservant le mot hébreu **זֶרַע‎** (Zéra‘) tel quel :\\n\\n---\\n\\n**זֶרַע‎** n.m. semence, graine, descendance —  \\n1. **Sens littéral :**  \\n   a. un ensemencement, d’où  \\n   b. ensemencement comme phénomène régulier revenant à sa saison.  \\n\\n2. **Graine :**  \\n   a. littéralement, semée pour produire des récoltes alimentaires, habituellement du blé, de l’orge, etc.  \\n   b. figuré, de l’idolâtrie de Juda ; des fortunes de Sion — l’action de répandre la semence, c’est-à-dire la quantité appropriée pour semer ;  \\n   — comme produisant la récolte, au sens figuré d’une croissance rapide et abondante dans le temps à venir ;  \\n   — concernant la croissance et la prospérité d’Israël.  \\n   c. **Zéra‘** comme produit :  \\n   — la manne est comparée avec **זֶרַע** de coriandre ;  \\n   — semence d’herbes et d’arbres.  \\n   d. En particulier, **זֶרַע** comme produit céréale, récolte de grains (bien que ce ne soit pas toujours clairement distingué).  \\n\\n3. **Zéra‘ = semence virile :**  \\n   — habituellement **שִׁכְבַת־זֶרַע**, écoulement de semence ;  \\n   — comme accusatif de manière (accusatif de mode).  \\n\\n4. **Zéra‘ = descendance :**  \\n   a. rarement utilisé pour les animaux, collectivement.  \\n   b. généralement pour les humains, collectivement = descendants, postérité ;  \\n   — **Zéra‘** de la femme ;  \\n   — **Zéra‘** des patriarches (en particulier Abraham) ;  \\n   — = un fils en tant que porteur de postérité.  \\n   c. **Zéra‘** (= postérité) d’autres individus :  \\n   — en particulier **Zéra‘** de David comme oint pour régner, comme assis sur le trône ;  \\n   — de Yekonya (Jehoïakin), Yehoyaqim (Jehoïakim) ;  \\n   — d’un enfant (fils) en tant que porteur de postérité ;  \\n   — de **Zéra‘** de Noé et de ses fils ;  \\n   — d’Aaron ;  \\n   — de Phinéas ;  \\n   — de David ;  \\n   — du **Zéra‘** des justes.  \\n   d. spécifiquement d’un enfant particulier (fils), enfants et petits-enfants.  \\n   e. = famille ; en particulier famille royale : **זֶרַע הַמֶּלֶךְ** ;  \\n   — = généalogie ;  \\n   — = nation d’appartenance, en tant que sang commun.  \\n\\n**Certains verbes utilisés avec זֶרַע dans ces sens sont :**  \\n*(référence aux formes verbales accompagnant les différents usages, non développée ici)*\\n\\n---\\n\\n**Source :**  \\nWhitaker, Richard ; Francis Brown ; S.R. Driver \u0026 Charles A. Briggs. *The Abridged Brown-Driver-Briggs Hebrew-English Lexicon of the Old Testament*, 1906.\\n\\n---\\n\\nSouhaites-tu que je l’intègre à une fiche dans ton projet de livre, ou que je continue avec un autre mot hébreu ?\",{},{\"_274\":2670,\"_281\":2685,\"_55\":2686,\"_285\":2687,\"_287\":288,\"_290\":291,\"_292\":2688,\"_294\":295},\"95d1ac60-2b66-4af5-9b8e-a6467031209c\",[2660],{\"_416\":472,\"_292\":2691},1754404476.450357,{\"_411\":412,\"_413\":2689},{\"_464\":14,\"_319\":2678,\"_469\":-5,\"_2327\":2328,\"_329\":10,\"_327\":14},[2690],\"זֶרַע‎ n.m. sowing, seed, offspring — 1. lit.: a. a sowing, hence b. sowing as regularly recurring at its season. 2. seed: a. lit., sown, to raise crops for food, usu. corn (wheat, barley, etc.) b. fig., of idolatry of Judah; of fortunes of Zion the dropping of seed, i.e. the proper quantity for sowing; as yielding the crop, in fig. of rapid and plentiful growth in the coming time; of growth and prosperity of Israel. c. seed as product; the manna is comp. with נַּד‎ ˊז‍‎, coriander seed; seed of herbs and trees. Esp. d. seed as corn-product, corn-crop, so (although not quite clearly). 3. seed = semen virile; usu. ˊשִׁכְבַת־ז‍‎, flow of semen; as acc. modi. 4. seed = offspring: a. rarely of animals, coll. Usu. b. of mankind, coll. = descendants, posterity; seed of the woman; seed of the patriarchs (esp.Abr.); = a son as involving posterity. c. seed (= posterity) of other individuals; esp. of seed of David as anointed to reign, as sitting on throne; of Jehoiachin, Jehoiakim; of child (son) as involv
